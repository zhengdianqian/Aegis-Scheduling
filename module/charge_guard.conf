# charge_guard.conf — 充电阈值控制配置
# 修改后 3 秒内生效，无需重启。总开关见 WebUI「充电控制」页，或 charge_guard_enable 文件。
# 日志：charge_guard/data/log.log

#------------------------------

# 停止充电电量：电量 >= 该值时停止充电。范围 1-100，填 100 视为“充满即停”，填 110 关闭电量停充功能（仅保留温控）。
# 要求：power_stop > power_start，否则本次配置无效，自动回退上一次合法值。
power_stop=80

# 恢复充电电量：电量 <= 该值时恢复充电。建议与 power_stop 间隔 5-10，间隔太小在部分机型上会导致插着电反复唤醒。
# 只有由本功能自身触发的停充，才会被它自动恢复。
power_start=70

# 延时功能：触发停充前先继续充电 N 秒（默认 3 秒），一旦倒计时开始不可取消。
power_stop_time=3

# 充满再停：1=开启 0=关闭。电量与 power_stop 都为 100 时，等涓流充电结束（电流降到 100mA 以下）再停充。
# 开启后 power_stop_time 延时功能自动失效。个别机型不支持涓流电流读数，请自行验证。
charge_full=0

# 自动拔插：1=开启 0=关闭。每次插上充电器时自动停充再恢复一次，用于个别机型充电时快充不激活的问题。
power_reset=0

#------------------------------

# 温控开关：1=开启 0=关闭
temperature_switch=1

# 温控-停止充电温度（摄氏度）：电池温度 >= 该值时停止充电。要求 stop > start。
temperature_switch_stop=45

# 温控-恢复充电温度（摄氏度）：电池温度 <= 该值时恢复充电。建议与 stop 间隔 3 度以上。
temperature_switch_start=40

#------------------------------

# 预约充满：1=开启 0=关闭。在 sched_time 之前充到目标电量，其余时间用停充节点按住，每天重复。
# 目标电量：charge_full=1 时为“涓流充满”，否则为 power_stop。
# 需要插电且距充满时刻不超过 sched_window 小时才会介入；到点无论如何都会放行。
sched_switch=0

# 充满时刻 HH:MM（本地时间）
sched_time=08:00

# 安全余量（分钟）：提前这么久充完，防止实际充电比预计慢。范围 0-180。
sched_margin=15

# 保底电量（%）：低于该值不按住，先正常充；回到该值+10 再按住。范围 0-90，0=不设保底。
sched_floor=20

# 生效窗口（小时）：距充满时刻超过它则本次不预约，照常充。范围 1-16。
sched_window=12

#------------------------------

# 自定义供电开关：自动扫描无效或效果不佳时，在此手动追加可用节点，每行一个，填入后优先于自动扫描结果。
# 格式：power_switch=[文件路径 start=开值 stop=关值]（空格可用 :: 代替）
# 示例（按需取消注释，勿照抄不适用本机的节点）：
#power_switch=[/sys/class/power_supply/battery/input_suspend start=0 stop=1]
#power_switch=[/sys/class/power_supply/battery/charge_disable start=0 stop=1]
