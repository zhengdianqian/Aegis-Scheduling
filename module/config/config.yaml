# 元信息
meta:
  name: "aegis_config"
  author: "Aegis"
  language: "zh"
  loglevel: "INFO"

# 功能开关
function:
  CpuIdleScalingGovernor: false
  IOOptimization: true

# IO 调度设置
IO_Settings:
  Scheduler: "none"
  read_ahead_kb: "128"
  nomerges: "2"
  iostats: "0"

# CPU 空闲设置
CpuIdle:
  current_governor: ""

# 省电模式：静态深度压频，上限 0.70，手势/前台起步走免确认通道
powersave:
  cpu_load_governor:
    up_threshold: 0.80
    down_threshold: 0.50
    smoothing_up: 0.55
    smoothing_down: 0.45
    down_rate_limit_ticks: 2
    up_rate_limit_ticks: 2
    headroom_factor: 1.05
    perf_floor: 0.0
    perf_ceil: 0.70
    perf_init: 0.22
    up_jump_threshold: 0.35
    slow_up_scale: 0.15
    slow_down_scale: 0.55
    down_fast_threshold: 0.25
    down_fast_mult: 4.5
    spike_jump_threshold: 0.42
    low_load_gain: 0.42
    interact_fg_util: 0.18
    # 前台进程树整体空闲时（真·静止），目标 perf 深度封顶
    background_ceiling: 0.22
    # 按簇序号（policy 升序）独立封顶；超大核单独压到 0.60，避开无效高频
    cluster_ceil: [0.70, 0.70, 0.60]

# 标准模式：目标紧跟真实负载，超大核留 15% 余量不封死
balance:
  cpu_load_governor:
    up_threshold: 0.80
    down_threshold: 0.48
    smoothing_up: 0.70
    smoothing_down: 0.35
    down_rate_limit_ticks: 2
    up_rate_limit_ticks: 2
    headroom_factor: 1.05
    perf_floor: 0.0
    perf_ceil: 1.0
    perf_init: 0.32
    up_jump_threshold: 0.35
    slow_up_scale: 0.18
    slow_down_scale: 0.55
    # 快速沉底门槛下调：只在前台几乎完全空闲（util<0.08）才允许 4x 快降，
    # 避免交互中途 util 短暂回落到 0.08~0.25 就被打回最低频，造成频率锯齿
    # 与切换/通知栏掉帧
    down_fast_threshold: 0.08
    down_fast_mult: 4.0
    spike_jump_threshold: 0.42
    low_load_gain: 0.50
    interact_fg_util: 0.18
    # 前台进程树整体空闲时（真·静止：无动画无渲染），目标 perf 额外封顶
    background_ceiling: 0.28
    # 按簇序号（小核/中核/超大核）独立封顶；超大核 0.85 只在大负载才动
    cluster_ceil: [1.0, 1.0, 0.85]

# 性能模式：撤掉静态底频，低门槛快升，重载才用超大核满频
performance:
  cpu_load_governor:
    up_threshold: 0.72
    down_threshold: 0.42
    smoothing_up: 0.85
    smoothing_down: 0.22
    down_rate_limit_ticks: 4
    up_rate_limit_ticks: 1
    headroom_factor: 1.10
    perf_floor: 0.0
    perf_ceil: 1.0
    perf_init: 0.45
    up_jump_threshold: 0.35
    slow_up_scale: 0.20
    slow_down_scale: 0.40
    down_fast_threshold: 0.18
    down_fast_mult: 3.0
    spike_jump_threshold: 0.32
    low_load_gain: 0.62
    interact_fg_util: 0.18
    # 前台空闲压频放宽（性能模式更看重即时响应），仅前台树整体空闲拍生效
    background_ceiling: 0.38
    # 按簇序号（policy 升序）独立封顶；性能模式不封顶，1.0=不封
    cluster_ceil: [1.0, 1.0, 1.0]

# 极速模式：锁满频，不参与调频
fast:
  cpu_load_governor:
    up_threshold: 0.01
    down_threshold: 0.01
    smoothing_up: 1.0
    smoothing_down: 0.01
    down_rate_limit_ticks: 10
    up_rate_limit_ticks: 1
    headroom_factor: 2.0
    perf_floor: 1.0
    perf_ceil: 1.0
    perf_init: 1.0
    up_jump_threshold: 0.35
    slow_up_scale: 0.02
    slow_down_scale: 0.5
    down_fast_threshold: 0.10
    down_fast_mult: 2.5
    spike_jump_threshold: 0.35
    low_load_gain: 1.0
    interact_fg_util: 0.25
