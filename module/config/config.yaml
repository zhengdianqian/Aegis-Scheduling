# 元数据信息
meta:
  name: "aegis_config"
  author: "Aegis"
  language: "zh"
  loglevel: "INFO"

# 主要功能开关
function:
  CpuIdleScalingGovernor: false
  IOOptimization: true

# IO 设置
IO_Settings:
  Scheduler: "none"
  read_ahead_kb: "128"
  nomerges: "2"
  iostats: "0"

# CPU 空闲设置
CpuIdle:
  current_governor: ""

# --- 性能模式 ---
# 8Gen2/领先版适配（三集群硬件频率边界）：
#   小核 policy0: 307200 ~ 2016000 (16 档)
#   中核 policy3: 499200 ~ 2803200 (19 档)
#   超大核 policy7: 595200 ~ 3360000 (20 档)
# perf 归一化: 0.0 = 各集群硬件最低频, 1.0 = 各集群最高频
# 采样 tick = 100ms。
#
# v7 规则（无状态、无模式切换）：频率只跟随真实负载。
#   target_perf = raw_util × gain
#   gain 是一条随负载单调上升的连续直线：
#     raw ≤ down_threshold → gain = low_load_gain   （静态/轻载深度压频）
#     raw ≥ up_threshold   → gain = headroom_factor （重载留帧余量）
#     两阈值之间线性插值，全程无阶跃。
#
# v3 调参原则（2026-10-15）：修复"频率空转"——原 headroom 1.15-1.30 +
#   up_threshold 0.55-0.75 导致中载 target 被放大到 2700MHz（实际只需 1600MHz）。
#   三模式统一改：headroom 降到 1.05-1.10 + up_threshold 提到 0.75-0.85
#   + down_threshold 提到 0.45-0.55（拓宽线性带，让中频占比最大）。
#   不靠 low_load_gain 强压（仅静态生效），不封顶 perf_ceil（除 powersave 0.70）。

# 省电模式：v3 拓宽中频带 + 保留 0.70 上限
#   util 0.55→0.22→1203MHz；util 0.70→0.51→1998MHz；util 0.85→0.89→capped 2530MHz
powersave:
  cpu_load_governor:
    up_threshold: 0.85
    down_threshold: 0.55
    smoothing_up: 0.50
    smoothing_down: 0.45
    down_rate_limit_ticks: 2
    up_rate_limit_ticks: 2
    headroom_factor: 1.05
    perf_floor: 0.0
    perf_ceil: 0.70
    perf_init: 0.25
    up_jump_threshold: 0.35
    slow_up_scale: 0.10
    slow_down_scale: 0.55
    down_fast_threshold: 0.25
    down_fast_mult: 4.5
    spike_jump_threshold: 0.50
    low_load_gain: 0.40
    interact_fg_util: 0.25

# 标准模式：v3 target 紧跟真实 util，不放大；启动可冲满频，平时不空转
#   util 0.5→0.275→1354MHz；util 0.65→0.497→1966MHz；util 1.0→3360MHz
balance:
  cpu_load_governor:
    up_threshold: 0.85
    down_threshold: 0.50
    smoothing_up: 0.65
    smoothing_down: 0.35
    down_rate_limit_ticks: 2
    up_rate_limit_ticks: 2
    headroom_factor: 1.05
    perf_floor: 0.0
    perf_ceil: 1.0
    perf_init: 0.35
    up_jump_threshold: 0.35
    slow_up_scale: 0.15
    slow_down_scale: 0.55
    down_fast_threshold: 0.25
    down_fast_mult: 4.0
    spike_jump_threshold: 0.50
    low_load_gain: 0.55
    interact_fg_util: 0.25

# 性能模式：v3 拓宽中频带，仍倾向高位但不再中载直冲 2700MHz
#   util 0.45→0.34→1528MHz；util 0.60→0.555→2129MHz；util 0.75→0.825→2876MHz；util 1.0→3360MHz
performance:
  cpu_load_governor:
    up_threshold: 0.75
    down_threshold: 0.45
    smoothing_up: 0.85
    smoothing_down: 0.20
    down_rate_limit_ticks: 4
    up_rate_limit_ticks: 1
    headroom_factor: 1.10
    perf_floor: 0.10
    perf_ceil: 1.0
    perf_init: 0.55
    up_jump_threshold: 0.35
    slow_up_scale: 0.15
    slow_down_scale: 0.40
    down_fast_threshold: 0.20
    down_fast_mult: 3.0
    spike_jump_threshold: 0.35
    low_load_gain: 0.75
    interact_fg_util: 0.25

# 极速模式：锁最高频，不参与下探
fast:
  cpu_load_governor:
    up_threshold: 0.01
    down_threshold: 0.01
    smoothing_up: 1.0
    smoothing_down: 0.01
    down_rate_limit_ticks: 10
    up_rate_limit_ticks: 1
    headroom_factor: 2.0
    perf_floor: 1.0
    perf_ceil: 1.0
    perf_init: 1.0
    up_jump_threshold: 0.35
    slow_up_scale: 0.02
    slow_down_scale: 0.5
    down_fast_threshold: 0.10
    down_fast_mult: 2.5
    spike_jump_threshold: 0.35
    low_load_gain: 1.0
    interact_fg_util: 0.25
