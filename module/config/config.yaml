# 元信息
meta:
  name: "aegis_config"
  author: "Aegis"
  language: "zh"
  loglevel: "INFO"

# 功能开关
function:
  CpuIdleScalingGovernor: false
  IOOptimization: true

# IO 调度设置
IO_Settings:
  Scheduler: "none"
  read_ahead_kb: "128"
  nomerges: "2"
  iostats: "0"

# CPU 空闲设置
CpuIdle:
  current_governor: ""

# 省电模式：静态深度压频，上限 0.70，手势走 jump 通道起步
powersave:
  cpu_load_governor:
    up_threshold: 0.85
    down_threshold: 0.55
    smoothing_up: 0.50
    smoothing_down: 0.45
    down_rate_limit_ticks: 2
    up_rate_limit_ticks: 2
    headroom_factor: 1.05
    perf_floor: 0.0
    perf_ceil: 0.70
    perf_init: 0.25
    up_jump_threshold: 0.35
    slow_up_scale: 0.10
    slow_down_scale: 0.55
    down_fast_threshold: 0.25
    down_fast_mult: 4.5
    spike_jump_threshold: 0.50
    low_load_gain: 0.40
    interact_fg_util: 0.25
    # 前台进程树整体空闲时（真·静止），目标 perf 深度封顶
    background_ceiling: 0.25
    # 按簇序号（policy 升序）独立封顶；与 perf_ceil 一致=不额外收紧，想只压大核单独改末位
    cluster_ceil: [0.70, 0.70, 0.70]

# 标准模式：目标紧跟真实负载，不封最高频
balance:
  cpu_load_governor:
    up_threshold: 0.85
    down_threshold: 0.50
    smoothing_up: 0.65
    smoothing_down: 0.35
    down_rate_limit_ticks: 2
    up_rate_limit_ticks: 2
    headroom_factor: 1.05
    perf_floor: 0.0
    perf_ceil: 1.0
    perf_init: 0.35
    up_jump_threshold: 0.35
    slow_up_scale: 0.15
    slow_down_scale: 0.55
    down_fast_threshold: 0.25
    down_fast_mult: 4.0
    spike_jump_threshold: 0.50
    low_load_gain: 0.55
    interact_fg_util: 0.25
    # 前台进程树整体空闲时（真·静止：无动画无渲染），目标 perf 额外封顶
    background_ceiling: 0.35
    # 按簇序号（小核/中核/超大核）独立封顶；标准模式不限制，1.0=不封
    cluster_ceil: [1.0, 1.0, 1.0]

# 性能模式：低门槛快升缓降，保留 0.10 底频
performance:
  cpu_load_governor:
    up_threshold: 0.75
    down_threshold: 0.45
    smoothing_up: 0.85
    smoothing_down: 0.20
    down_rate_limit_ticks: 4
    up_rate_limit_ticks: 1
    headroom_factor: 1.10
    perf_floor: 0.10
    perf_ceil: 1.0
    perf_init: 0.55
    up_jump_threshold: 0.35
    slow_up_scale: 0.15
    slow_down_scale: 0.40
    down_fast_threshold: 0.20
    down_fast_mult: 3.0
    spike_jump_threshold: 0.35
    low_load_gain: 0.75
    interact_fg_util: 0.25
    # 前台空闲压频放宽（性能模式更看重即时响应），仅前台树整体空闲拍生效
    background_ceiling: 0.45
    # 按簇序号（policy 升序）独立封顶；性能模式不封顶，1.0=不封
    cluster_ceil: [1.0, 1.0, 1.0]

# 极速模式：锁满频，不参与调频
fast:
  cpu_load_governor:
    up_threshold: 0.01
    down_threshold: 0.01
    smoothing_up: 1.0
    smoothing_down: 0.01
    down_rate_limit_ticks: 10
    up_rate_limit_ticks: 1
    headroom_factor: 2.0
    perf_floor: 1.0
    perf_ceil: 1.0
    perf_init: 1.0
    up_jump_threshold: 0.35
    slow_up_scale: 0.02
    slow_down_scale: 0.5
    down_fast_threshold: 0.10
    down_fast_mult: 2.5
    spike_jump_threshold: 0.35
    low_load_gain: 1.0
    interact_fg_util: 0.25
